<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ad tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600;1,700&display=swap" rel="stylesheet">
<style>
  :root{
    --mint:#C5DCD0; --mint-2:#B4CFC0;
    --lime:#E4F249; --lime-hi:#EDF86B; --lime-soft:#EFF7A8;
    --ink:#14181A; --ink-2:#3C4643;
    --on-lime:rgba(20,24,26,.56); --on-lime-line:rgba(20,24,26,.13);
    --white:#fff; --muted:#6E7B76; --muted-2:#9AA8A2; --line:#E7EDE9;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--mint); color:var(--ink);
    font-family:'Inter',-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
    font-size:15px; line-height:1.5; font-feature-settings:'tnum' 1;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:1160px;margin:0 auto;padding:34px 24px 90px}

  /* header */
  header{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:22px;flex-wrap:wrap}
  header h1{font-size:27px;font-weight:700;letter-spacing:-.035em;margin:0}
  header h1 em{font-style:italic;font-weight:700}
  .nav{display:flex;align-items:center;gap:2px;background:var(--white);border-radius:999px;padding:4px}
  .nav button{width:32px;height:32px;border:0;background:transparent;border-radius:999px;cursor:pointer;
    color:var(--ink-2);font-size:15px;font-family:inherit;display:grid;place-items:center;transition:background .14s}
  .nav button:hover{background:#EFF4F0;color:var(--ink)}
  .nav .m{font-size:14px;font-weight:600;padding:0 13px;min-width:92px;text-align:center;white-space:nowrap;letter-spacing:-.015em}

  /* tabs */
  .tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:22px}
  .tabs button{border:0;background:rgba(255,255,255,.6);font-family:inherit;font-size:13.5px;font-weight:500;
    color:var(--ink-2);padding:10px 19px;border-radius:999px;cursor:pointer;transition:background .15s,color .15s;letter-spacing:-.01em}
  .tabs button:hover{background:rgba(255,255,255,.95)}
  .tabs button[aria-selected="true"]{background:var(--ink);color:var(--white)}


  /* grid */
  .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:11px}
  .sq{background:var(--lime);border:0;border-radius:18px;padding:17px 16px 18px;min-height:188px;
    display:flex;flex-direction:column;align-items:center;justify-content:flex-start;
    font-family:inherit;color:var(--ink);cursor:pointer;text-align:center;position:relative;overflow:hidden;
    transition:transform .13s ease,background .15s}
  .sq:hover{background:var(--lime-hi);transform:translateY(-2px)}
  .sq:focus-visible{outline:2.5px solid var(--ink);outline-offset:2px}
  .sq.on{background:var(--lime-hi);box-shadow:inset 0 0 0 2.5px var(--ink)}
  .sq.flat{background:var(--lime-soft)}
  .sq.flat:hover{background:var(--lime)}

  .sq .kicker{font-size:10px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;
    color:var(--on-lime);height:13px;line-height:13px;margin-bottom:7px}
  .sq .t{font-size:15px;font-weight:700;letter-spacing:-.025em;margin-bottom:auto}
  .sq .stats{display:flex;flex-direction:column;gap:13px;width:100%;margin-top:15px}
  .sq .n{font-size:31px;font-weight:700;line-height:1;letter-spacing:-.045em;display:block}
  .sq .l{font-size:12.5px;font-weight:400;color:var(--on-lime);display:block;line-height:1.4;letter-spacing:-.005em}
  .sq .l i{font-style:normal;font-weight:600;color:var(--ink)}
  .sq .rail{position:absolute;left:0;right:0;bottom:0;height:4px;background:var(--on-lime-line)}
  .sq .rail>span{display:block;height:100%;background:var(--ink);transition:width .5s cubic-bezier(.2,.8,.2,1)}

  /* inline detail panel */
  .panel{grid-column:1/-1;background:var(--white);border-radius:18px;padding:24px 26px 26px;
    position:relative;margin-top:6px;animation:pop .22s cubic-bezier(.2,.8,.2,1)}
  @keyframes pop{from{opacity:0;transform:translateY(-7px)}to{opacity:1;transform:none}}
  .panel::before{content:'';position:absolute;top:-8px;left:var(--notch,50%);transform:translateX(-50%);
    width:18px;height:9px;background:var(--white);clip-path:polygon(50% 0,100% 100%,0 100%)}

  .p-head{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:16px}
  .p-head h3{margin:0;font-size:20px;font-weight:700;letter-spacing:-.03em}
  .p-head h3 em{font-style:italic}
  .p-head .x{border:0;background:#F2F6F3;font-family:inherit;font-size:13px;font-weight:500;color:var(--ink-2);
    cursor:pointer;padding:7px 14px;border-radius:999px;transition:background .14s}
  .p-head .x:hover{background:#E6EDE8;color:var(--ink)}

  /* 1. format gap */
  .gap{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px;margin-bottom:20px}
  .gcell{background:#F5F9F6;border-radius:13px;padding:15px 17px;min-width:0}
  .gcell .gl{font-size:10px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin-bottom:7px}
  .gcell .gn{font-size:25px;font-weight:700;letter-spacing:-.04em;line-height:1}
  .gcell .gn span{font-size:14px;font-weight:500;color:var(--muted);letter-spacing:-.01em}
  .gbar{height:5px;background:#E2EAE5;border-radius:99px;margin:11px 0 8px;overflow:hidden;display:flex}
  .gbar i{display:block;height:100%}
  .gbar .a{background:var(--ink)}
  .gbar .b{background:var(--mint-2)}
  .gcell .gs{font-size:12.5px;color:var(--muted)}
  .gcell .gs b{color:var(--ink);font-weight:600}

  /* 2+3 funnels */
  .fgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:11px}
  .fcol{background:#F5F9F6;border-radius:13px;padding:15px 17px 16px;min-width:0}
  .fcol .fh{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-bottom:3px}
  .fcol .fn{font-size:14px;font-weight:700;letter-spacing:-.02em}
  .fcol .fs{font-size:12px;color:var(--muted);white-space:nowrap}
  .fcol .fs b{color:var(--ink);font-weight:600}
  .fcol .fmeta{font-size:12px;color:var(--muted);padding-bottom:10px;margin-bottom:4px;border-bottom:1px solid #E4EBE6}
  .fcol .fmeta b{color:var(--ink);font-weight:600}

  .m{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding:6px 0;font-size:13px}
  .m .mt{color:var(--ink-2);line-height:1.4;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .m .mv{font-size:12px;color:var(--muted);white-space:nowrap;flex:none}
  .m .mv b{color:var(--ink);font-weight:600}
  .m.z .mt,.m.z .mv{color:var(--muted-2)}
  .more{border:0;background:transparent;font-family:inherit;font-size:12px;font-weight:500;color:var(--muted);
    cursor:pointer;padding:7px 0 0;text-decoration:underline;text-underline-offset:3px}
  .more:hover{color:var(--ink)}
  .nil{font-size:12.5px;color:var(--muted-2);padding:8px 0}

  /* weekly */
  .wgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:11px}
  .wk{background:var(--white);border-radius:18px;padding:17px 17px 19px;min-height:158px;display:flex;flex-direction:column}
  .wk.now{background:var(--lime)}
  .wk .kicker{font-size:10px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);height:13px;margin-bottom:7px}
  .wk.now .kicker{color:var(--on-lime)}
  .wk .wd{font-size:13px;font-weight:600;letter-spacing:-.015em;margin-bottom:auto}
  .wk .wn{font-size:31px;font-weight:700;letter-spacing:-.045em;line-height:1;margin-top:14px}
  .wk .wl{font-size:12.5px;color:var(--muted)}
  .wk.now .wl{color:var(--on-lime)}
  .wk .wp{font-size:12.5px;color:var(--muted);margin-top:10px;padding-top:10px;border-top:1px solid var(--line)}
  .wk.now .wp{color:var(--on-lime);border-top-color:var(--on-lime-line)}
  .wk .wp b{color:var(--ink);font-weight:600}

  .tools{margin-left:auto;display:flex;align-items:center;gap:8px}
  .tbtn{border:0;background:rgba(255,255,255,.6);font-family:inherit;font-size:13px;font-weight:500;
    color:var(--ink-2);padding:10px 16px;border-radius:999px;cursor:pointer;transition:background .15s;
    display:inline-flex;align-items:center;gap:7px}
  .tbtn:hover{background:rgba(255,255,255,.95);color:var(--ink)}
  .tnote{font-size:12px;color:var(--ink-2);opacity:.75;white-space:nowrap}
  .tnote b{font-weight:600;opacity:1}
  .tnote button{border:0;background:transparent;font-family:inherit;font-size:12px;color:var(--ink-2);
    cursor:pointer;text-decoration:underline;text-underline-offset:2px;padding:0 0 0 8px}
  .tnote button:hover{color:var(--ink)}
  .toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:var(--ink);color:#fff;
    padding:13px 20px;border-radius:12px;font-size:13.5px;max-width:min(560px,92vw);z-index:50;
    box-shadow:0 8px 30px rgba(0,0,0,.22);line-height:1.45}
  .toast.bad{background:#8C2F1B}
  @media(max-width:640px){.tools{width:100%;margin-left:0;justify-content:space-between}}
  .editing{background:var(--white);outline:none;border-radius:6px;padding:0 6px;min-width:30px;display:inline-block}

  footer{margin-top:26px;font-size:12.5px;color:var(--muted);display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;padding:0 3px}

  @media(max-width:940px){
    .grid{grid-template-columns:repeat(3,1fr)}
    .wgrid{grid-template-columns:repeat(3,1fr)}
    .fgrid{grid-template-columns:minmax(0,1fr);gap:9px}
  }
  @media(max-width:640px){
    .wrap{padding:22px 13px 70px}
    .grid,.wgrid{grid-template-columns:repeat(2,1fr);gap:9px}
    .sq{min-height:168px;padding:14px 11px 16px;border-radius:15px}
    .sq .n{font-size:27px}
    .panel{padding:19px 16px 20px;border-radius:15px}
    .gap{grid-template-columns:minmax(0,1fr)}
    header h1{font-size:22px}
  }
</style>
</head>

  <section id="body"></section>

</div>

const MN=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const MFULL=['January','February','March','April','May','June','July','August','September','October','November','December'];
const mLabel=y=>{const[a,b]=y.split('-').map(Number);return `${MN[b-1]} ${a}`};
const mWord=y=>MFULL[Number(y.split('-')[1])-1];
function shift(y,d){const[a,b]=y.split('-').map(Number);const t=new Date(a,b-1+d,1);return `${t.getFullYear()}-${String(t.getMonth()+1).padStart(2,'0')}`}
function dim(y){const[a,b]=y.split('-').map(Number);return new Date(a,b,0).getDate()}
function isoWeek(ds){const d=new Date(ds+'T00:00:00'),t=new Date(d);t.setDate(t.getDate()-((d.getDay()+6)%7)+3);const f=t.valueOf();t.setMonth(0,1);if(t.getDay()!==4)t.setMonth(0,1+((4-t.getDay())+7)%7);return 1+Math.ceil((f-t)/(7*864e5))}
function weeksOf(ym){const[y,m]=ym.split('-').map(Number),n=dim(ym),o=new Map();
  for(let d=1;d<=n;d++){const ds=`${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`,w=isoWeek(ds);
    if(!o.has(w)){const dt=new Date(y,m-1,d),mo=new Date(dt);mo.setDate(dt.getDate()-((dt.getDay()+6)%7));const su=new Date(mo);su.setDate(mo.getDate()+6);o.set(w,{w,mo,su})}}
  return[...o.values()].sort((a,b)=>a.mo-b.mo)}
const sd=d=>`${d.getDate()} ${MN[d.getMonth()]}`;

const $=id=>document.getElementById(id);
const colCount=()=>window.innerWidth<=640?2:window.innerWidth<=940?3:4;

const monthAds=ym=>DATA.ads.filter(a=>a.month===ym);
function target(p){const t=DATA.targets[p]||{};let v=0,s=0;
  for(const f in t)for(const m in t[f]){v+=t[f][m].video||0;s+=t[f][m].static||0}
  if(v||s)return{video:v,static:s,total:v+s};
  const o=state.overrides[p];
  if(o&&(o.video||o.static))return{video:o.video||0,static:o.static||0,total:(o.video||0)+(o.static||0)};
  return{video:0,static:0,total:0}}
function split(ads){const c=f=>ads.filter(a=>a.format===f).length;return{v:c('Video'),s:c('Static'),g:c('GIF'),n:ads.length}}
function totals(){const ads=monthAds(state.month);
  const planned=new Set(DATA.portfolios.filter(p=>target(p).total>0));
  const inP=a=>planned.has(a.portfolio);
  let tv=0,ts=0;for(const p of planned){const t=target(p);tv+=t.video;ts+=t.static}
  return{
    live:split(ads.filter(a=>a.shipped&&inP(a))),
    liveOff:split(ads.filter(a=>a.shipped&&!inP(a))),
    pipe:split(ads.filter(a=>!a.shipped&&inP(a))),
    pipeOff:split(ads.filter(a=>!a.shipped&&!inP(a))),
    tv,ts,tot:tv+ts,nPlanned:planned.size};}

/* ── card + panel assembly ── */
function paint(items){
  state.cols=colCount();
  let html='';
  items.forEach((h,i)=>{
    html+=h;
    if(state.open!==null){
      const oi=items.findIndex(x=>x.includes(`data-p="${esc(state.open)}"`));
      if(oi>=0){
        const rowEnd=Math.min(items.length-1,(Math.floor(oi/state.cols)+1)*state.cols-1);
        if(i===rowEnd){
          const notch=((oi%state.cols)+0.5)/state.cols*100;
          html+=panel(state.open,notch);
        }
      }
    }
  });
  $('body').innerHTML=`<div class="grid">${html}</div>`;
}

function card(p,pairs,o={}){
  return `<button class="sq${o.flat?' flat':''}${state.open===p?' on':''}" data-p="${esc(p)}">
    <span class="kicker">${o.kicker||''}</span>
    <span class="t">${esc(p)}</span>
    <span class="stats">${pairs.map(x=>`<span><span class="n">${x.n}</span><span class="l">${x.l}${x.of?` <i>${x.of}</i>`:''}</span></span>`).join('')}</span>
    ${o.rail!=null?`<span class="rail"><span style="width:${Math.min(100,o.rail)}%"></span></span>`:''}
  </button>`;
}

/* ── tabs ── */
function viewIdeal(){
  paint(DATA.portfolios.map(p=>{
    const t=target(p);
    if(!t.total)return `<button class="sq flat" data-set="${esc(p)}">
      <span class="kicker">not planned</span><span class="t">${esc(p)}</span>
      <span class="stats"><span><span class="n" style="opacity:.28">—</span>
      <span class="l" style="text-decoration:underline;text-underline-offset:3px">Set a target</span></span></span></button>`;
    return card(p,[{n:t.video,l:'Videos'},{n:t.static,l:'Statics'}]);
  }));
}

function viewActual(){
  const ads=monthAds(state.month);
  paint(DATA.portfolios.map(p=>{
    const t=target(p),s=split(ads.filter(a=>a.portfolio===p&&a.shipped)),
          pi=split(ads.filter(a=>a.portfolio===p&&!a.shipped));
    return card(p,[
      {n:s.v,l:'Videos',of:t.video?`of ${t.video}`:''},
      {n:s.s,l:'Statics',of:t.static?`of ${t.static}`:''},
    ],{flat:!s.n,kicker:pi.n?`${pi.n} in production`:'',rail:t.total?100*s.n/t.total:null});
  }));
}

function viewPipe(){
  const ads=monthAds(state.month);
  paint(DATA.portfolios.map(p=>{
    const s=split(ads.filter(a=>a.portfolio===p&&!a.shipped));
    return card(p,[{n:s.v,l:'Videos'},{n:s.s,l:'Statics'}],{flat:!s.n});
  }));
}

function viewWeek(){
  const ads=monthAds(state.month),wks=weeksOf(state.month);
  const now=new Date(),nowW=isoWeek(now.toISOString().slice(0,10));
  const nowYm=`${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}`;
  $('body').innerHTML=`<div class="wgrid">${wks.map(w=>{
    const inW=ads.filter(a=>isoWeek(a.closeBy)===w.w);
    const lv=inW.filter(a=>a.shipped).length,pi=inW.length-lv;
    const isNow=state.month===nowYm&&w.w===nowW;
    return `<div class="wk${isNow?' now':''}">
      <span class="kicker">${isNow?'this week':''}</span>
      <span class="wd">${sd(w.mo)} – ${sd(w.su)}</span>
      <span class="wn">${lv}</span><span class="wl">live</span>
      <span class="wp">${pi?`<b>${pi}</b> in production`:'nothing pending'}</span></div>`;
  }).join('')}</div>`;
}

/* ── panel ── */
function panel(p,notch){
  const t=target(p),ads=monthAds(state.month).filter(a=>a.portfolio===p),tg=DATA.targets[p]||{};
  const live=split(ads.filter(a=>a.shipped)),pipe=split(ads.filter(a=>!a.shipped));

  const gcell=(label,lv,pi,tt)=>{
    const a=tt?Math.min(100,100*lv/tt):0, b=tt?Math.min(100-a,100*pi/tt):0;
    return `<div class="gcell">
      <div class="gl">${label}</div>
      <div class="gn">${lv}${tt?` <span>of ${tt}</span>`:''}</div>
      <div class="gbar"><i class="a" style="width:${a}%"></i><i class="b" style="width:${b}%"></i></div>
      <div class="gs">${pi?`<b>${pi}</b> in production`:'nothing in production'}${tt?` · <b>${Math.max(0,tt-lv-pi)}</b> not started`:''}</div>
    </div>`;
  };

  const cols=['ToFu','MoFu','BoFu'].map(f=>{
    const fa=ads.filter(a=>a.funnel===f),tf=tg[f]||{};
    let tv=0,ts=0;for(const m in tf){tv+=tf[m].video||0;ts+=tf[m].static||0}
    const lv=split(fa.filter(a=>a.shipped)),pv=split(fa.filter(a=>!a.shipped));
    const map=new Map();
    for(const m in tf)map.set(m,{t:(tf[m].video||0)+(tf[m].static||0),l:0,p:0});
    for(const a of fa){if(!map.has(a.messaging))map.set(a.messaging,{t:0,l:0,p:0});
      const r=map.get(a.messaging);a.shipped?r.l++:r.p++}
    let list=[...map.entries()].filter(([,r])=>r.t||r.l||r.p)
      .sort((a,b)=>((b[1].l+b[1].p)-(a[1].l+a[1].p))||(b[1].t-a[1].t));
    const key=p+'|'+f,open=state.expanded.has(key),cap=5,hid=Math.max(0,list.length-cap);
    if(!open)list=list.slice(0,cap);
    const rows=list.length?list.map(([n,r])=>`<div class="m${(!r.l&&!r.p)?' z':''}">
      <span class="mt" title="${esc(n)}">${esc(n)}</span>
      <span class="mv">${r.t?`<b>${r.l}</b>/${r.t}`:`<b>${r.l}</b> live`}${r.p?` <span title="${r.p} in production">+${r.p}</span>`:''}</span></div>`).join('')
      :'<div class="nil">Nothing here this month.</div>';
    return `<div class="fcol">
      <div class="fh"><span class="fn">${f}</span><span class="fs"><b>${lv.n}</b>${(tv+ts)?` of ${tv+ts}`:''} live</span></div>
      <div class="fmeta"><b>${lv.v}</b>${tv?`/${tv}`:''} video · <b>${lv.s}</b>${ts?`/${ts}`:''} static${pv.n?` · ${pv.n} in production`:''}</div>
      ${rows}${hid?`<button class="more" data-k="${esc(key)}">${open?'Show fewer':`+${hid} more`}</button>`:''}</div>`;
  }).join('');

  const nof=ads.filter(a=>!['ToFu','MoFu','BoFu'].includes(a.funnel)).length;

  return `<div class="panel" style="--notch:${notch}%">
    <div class="p-head"><h3>${esc(p)}</h3><button class="x" data-close="1">Close</button></div>
    <div class="gap">${gcell('Videos',live.v,pipe.v,t.video)}${gcell('Statics',live.s,pipe.s,t.static)}</div>
    <div class="fgrid">${cols}</div>
    ${nof?`<div class="nil" style="padding-top:12px">${nof} ad${nof===1?'':'s'} in this portfolio has no funnel set, so it isn't in the three columns above.</div>`:''}
  </div>`;
}

/* ── events ── */
function render(){
  $('mLabel').textContent=mLabel(state.month);
  $('tabs').querySelectorAll('[role="tab"]').forEach(b=>b.setAttribute('aria-selected',String(b.dataset.t===state.tab)));
  ({ideal:viewIdeal,actual:viewActual,pipe:viewPipe,week:viewWeek})[state.tab]();
  document.querySelectorAll('.sq[data-p]').forEach(b=>b.onclick=()=>{
    state.open=state.open===b.dataset.p?null:b.dataset.p;state.expanded.clear();render()});
  document.querySelectorAll('.sq[data-set]').forEach(b=>b.onclick=()=>setTarget(b.dataset.set));
  document.querySelectorAll('.more').forEach(b=>b.onclick=e=>{e.stopPropagation();
    const k=b.dataset.k;state.expanded.has(k)?state.expanded.delete(k):state.expanded.add(k);render()});
  const x=document.querySelector('[data-close]');
  if(x)x.onclick=()=>{state.open=null;render()};
}

function setTarget(p){
  const sq=document.querySelector(`.sq[data-set="${CSS.escape(p)}"]`);
  sq.outerHTML=`<div class="sq flat" style="cursor:default">
    <span class="kicker">videos, then statics</span><span class="t">${esc(p)}</span>
    <span class="stats">
      <span><span class="n"><span class="editing" contenteditable="true" id="edV">0</span></span><span class="l">Videos</span></span>
      <span><span class="n"><span class="editing" contenteditable="true" id="edS">0</span></span><span class="l">Statics</span></span>
    </span></div>`;
  const v=$('edV'),s=$('edS');
  const pick=el=>{const r=document.createRange();r.selectNodeContents(el);const g=getSelection();g.removeAllRanges();g.addRange(r);el.focus()};
  const num=el=>parseInt(el.textContent.replace(/[^0-9]/g,''),10)||0;
  pick(v);
  v.onkeydown=e=>{if(e.key==='Enter'||e.key==='Tab'){e.preventDefault();pick(s)}if(e.key==='Escape')render()};
  s.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();s.blur()}if(e.key==='Escape')render()};
  s.onblur=()=>{state.overrides[p]={video:num(v),static:num(s)};saveOv().then(render)};
}

/* ── targets CSV ─────────────────────────────────────────────────
 * Expects the portfolio breakdown layout: a Portfolio column, a Funnel
 * column (ToFu/MoFu/BoFu), a Messaging column, and video/static count
 * columns. Header names are matched loosely so small edits won't break it.
 */
function parseCSV(text){
  text = text.replace(/^\uFEFF/,'');
  const rows=[]; let row=[], cell='', q=false;
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(q){
      if(c==='"'){ if(text[i+1]==='"'){cell+='"';i++} else q=false }
      else cell+=c;
    } else if(c==='"') q=true;
    else if(c===','){ row.push(cell); cell='' }
    else if(c==='\n'){ row.push(cell); rows.push(row); row=[]; cell='' }
    else if(c!=='\r') cell+=c;
  }
  if(cell.length||row.length){ row.push(cell); rows.push(row) }
  return rows.filter(r=>r.some(x=>x.trim()!==''));
}

const NORM = s => s.toLowerCase().replace(/[^a-z]/g,'');
const PF_ALIAS = {
  wavy:'Wavy', curly:'Curly', wurly:'Wurly', scalp:'Scalp', otf:'OTF', rsd:'RSD',
  waxstick:'Wax Stick', hws:'Wax Stick', ddhm:'DDHM', maskddhm:'DDHM', mask:'DDHM',
  hrhm:'HRHM', ha:'HA', ds:'DS', oil:'Oil',
};

function findCol(header, ...needles){
  for(let i=0;i<header.length;i++){
    const h=NORM(header[i]);
    for(const n of needles) if(h.includes(n)) return i;
  }
  return -1;
}

function buildTargets(text){
  const rows=parseCSV(text);
  if(rows.length<2) throw new Error('That file looks empty.');
  const header=rows[0];
  const cP=findCol(header,'portfolio');
  const cF=findCol(header,'funnel');
  const cM=findCol(header,'messaging','message');
  const cV=findCol(header,'videoreqd','videosreqd','videorequired','video');
  const cS=findCol(header,'staticsreqd','staticreqd','staticsrequired','static');
  const miss=[];
  if(cP<0)miss.push('Portfolio'); if(cF<0)miss.push('Funnel');
  if(cV<0)miss.push('Video reqd.'); if(cS<0)miss.push('Statics reqd.');
  if(miss.length) throw new Error('Missing column'+(miss.length>1?'s':'')+': '+miss.join(', ')+'.');

  const out={}, unknown=new Set();
  let n=0, assets=0;
  for(let i=1;i<rows.length;i++){
    const r=rows[i];
    const rawP=(r[cP]||'').trim();
    if(!rawP) continue;
    const p=PF_ALIAS[NORM(rawP)];
    if(!p){ unknown.add(rawP); continue }
    const f=(r[cF]||'').trim();
    const fn=['ToFu','MoFu','BoFu'].find(x=>x.toLowerCase()===f.toLowerCase());
    if(!fn) continue;
    const m=((cM>=0?r[cM]:'')||'').trim() || 'Unspecified';
    const v=parseInt((r[cV]||'').replace(/[^0-9]/g,''),10)||0;
    const st=parseInt((r[cS]||'').replace(/[^0-9]/g,''),10)||0;
    if(!v&&!st) continue;
    out[p]=out[p]||{}; out[p][fn]=out[p][fn]||{};
    const cur=out[p][fn][m]||{video:0,static:0};
    cur.video+=v; cur.static+=st;
    out[p][fn][m]=cur;
    n++; assets+=v+st;
  }
  if(!n) throw new Error('No usable rows found. Check the Portfolio and Funnel columns.');
  for(const p of DATA.portfolios) if(!out[p]) out[p]={};
  return {targets:out, rows:n, assets, unknown:[...unknown]};
}

function toast(msg, bad){
  document.querySelectorAll('.toast').forEach(t=>t.remove());
  const el=document.createElement('div');
  el.className='toast'+(bad?' bad':'');
  el.textContent=msg;
  document.body.appendChild(el);
  setTimeout(()=>el.remove(), bad?9000:5000);
}

async function applyTargets(text, label){
  const {targets,rows,assets,unknown}=buildTargets(text);
  DATA.targets=targets;
  state.overrides={};
  try{ await window.storage.set('targets_csv_v1', JSON.stringify({targets,label,at:Date.now(),assets})) }catch(e){}
  await saveOv();
  state.open=null; render(); targetNote(label, assets);
  let msg=`Loaded ${rows} rows — ${assets} assets planned.`;
  if(unknown.length) msg+=` Skipped unrecognised portfolio${unknown.length>1?'s':''}: ${unknown.slice(0,4).join(', ')}.`;
  toast(msg, unknown.length>0);
}

function targetNote(label, assets){
  const el=$('tnote'); if(!el) return;
  if(!label){ el.innerHTML=''; return }
  el.innerHTML=`Targets: <b>${esc(label)}</b> · ${assets} assets <button id="tReset">reset</button>`;
  const r=$('tReset');
  if(r) r.onclick=async()=>{
    DATA.targets=BOOT.targets; state.overrides={};
    try{ await window.storage.delete('targets_csv_v1') }catch(e){}
    await saveOv(); state.open=null; render(); targetNote(null);
    toast('Back to the built-in targets.');
  };
}

async function restoreTargets(){
  try{
    const r=await window.storage.get('targets_csv_v1');
    if(r&&r.value){
      const j=JSON.parse(r.value);
      if(j&&j.targets){ DATA.targets=j.targets; targetNote(j.label,j.assets) }
    }
  }catch(e){}
}

function wireUpload(){
  const btn=$('upBtn'), file=$('upFile');
  if(!btn||!file) return;
  btn.onclick=()=>file.click();
  file.onchange=async()=>{
    const f=file.files&&file.files[0];
    if(!f) return;
    try{
      const text=await f.text();
      await applyTargets(text, f.name);
    }catch(err){
      toast(err.message||'Could not read that file.', true);
    }
    file.value='';
  };
}

async function init(){
  await loadOv();
  await restoreTargets();
  wireUpload();
  const now=new Date();
  state.month=`${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}`;
  const have=[...new Set(DATA.ads.map(a=>a.month))].sort();
  if(!DATA.ads.some(a=>a.month===state.month)&&have.length)state.month=have[have.length-1];
  $('prev').onclick=()=>{state.month=shift(state.month,-1);state.open=null;render()};
  $('next').onclick=()=>{state.month=shift(state.month,1);state.open=null;render()};
  $('tabs').querySelectorAll('[role="tab"]').forEach(b=>b.onclick=()=>{state.tab=b.dataset.t;state.open=null;render()});
  let tm;addEventListener('resize',()=>{clearTimeout(tm);tm=setTimeout(()=>{if(colCount()!==state.cols)render()},140)});
  render();
  loadLive();
}

function pickMonth(){
  const now=new Date();
  const cur=`${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}`;
  if(DATA.ads.some(a=>a.month===cur)) return cur;
  const have=[...new Set(DATA.ads.map(a=>a.month))].sort();
  return have.length?have[have.length-1]:cur;
}

function srcLine(txt){const el=$('src');if(el)el.textContent=txt;}

async function loadLive(){
  srcLine('Checking Notion…');
  try{
    const r=await fetch('/api/data',{cache:'no-store'});
    if(!r.ok){
      let d={};try{d=await r.json()}catch(e){}
      throw new Error(d.error||('HTTP '+r.status));
    }
    const j=await r.json();
    if(!Array.isArray(j.ads)) throw new Error('unexpected response');
    if(!j.ads.length) throw new Error('Notion returned 0 rows — is the database shared with the connection?');
    DATA.ads=j.ads;
    state.month=pickMonth(); state.open=null;
    render();
    const t=j.fetchedAt?new Date(j.fetchedAt):new Date();
    srcLine(`Live from Notion · ${j.ads.length} ads · updated ${t.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})}`);
  }catch(e){
    srcLine(`Showing saved snapshot (${DATA.ads.length} ads) — ${e.message}`);
  }
}
init();
</script>
